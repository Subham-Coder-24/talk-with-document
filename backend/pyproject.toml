[project]
name = "rag-backend"
version = "0.1.0"
description = "Document chat (RAG) API: projects, uploads, hybrid retrieval, Azure OpenAI chat"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "openai>=1.50",
    "fastembed>=0.4",
    "numpy>=1.26",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
